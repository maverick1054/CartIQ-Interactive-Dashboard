version: '3.8'

services:
  cartiq-api:
    build: .
    container_name: cartiq_api
    command: uvicorn api:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    restart: unless-stopped

  cartiq-dashboard:
    build: .
    container_name: cartiq_dashboard
    command: streamlit run main.py --server.port=8502 --server.address=0.0.0.0
    ports:
      - "8502:8502"
    restart: unless-stopped
    depends_on:
      - cartiq-api
